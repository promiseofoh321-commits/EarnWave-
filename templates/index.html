<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EarnWave Mini App</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Google Fonts & Custom CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b132b;
            --card-bg: #1c2541;
            --accent-blue: #3a86ff;
            --text-white: #ffffff;
            --text-gray: #8d99ae;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            padding: 16px;
            padding-bottom: 80px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .app-title h1 {
            font-size: 20px;
            font-weight: 700;
        }
        .app-title p {
            font-size: 12px;
            color: var(--text-gray);
        }
        .balance-card {
            background: linear-gradient(135deg, #3a86ff, #2563eb);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 12px rgba(58, 134, 255, 0.3);
        }
        .balance-card .label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
        }
        .balance-card .amount {
            font-size: 32px;
            font-weight: 700;
            margin: 8px 0 16px 0;
        }
        .action-btn {
            background-color: var(--card-bg);
            border: none;
            border-radius: 12px;
            width: 100%;
            padding: 16px;
            color: var(--text-white);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .action-btn span {
            color: var(--accent-blue);
        }
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #080f24;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .nav-item {
            color: var(--text-gray);
            font-size: 11px;
            text-align: center;
            text-decoration: none;
        }
        .nav-item.active {
            color: var(--accent-blue);
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="app-title">
            <h1 id="username">EarnWave</h1>
            <p>Watch • Earn • Withdraw</p>
        </div>
    </div>

    <div class="balance-card">
        <div class="label">Available balance</div>
        <div class="amount" id="balance">$0.010</div>
        <div style="font-size: 12px; opacity: 0.9;">Today's earnings: $0.000</div>
    </div>

    <button class="action-btn" id="watchVideoBtn">
        <div>
            <div style="text-align: left;">Watch Bonus Video</div>
            <div style="font-size: 12px; color: var(--text-gray); font-weight: normal; margin-top: 4px;">Earn $0.003 per view</div>
        </div>
        <span>▶</span>
    </button>

    <div class="nav-bar">
        <a href="#" class="nav-item active">Home</a>
        <a href="#" class="nav-item">Earn</a>
        <a href="#" class="nav-item">Referrals</a>
        <a href="#" class="nav-item">Withdraw</a>
        <a href="#" class="nav-item">Profile</a>
    </div>

    <script>
        // Initialize Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Personalize title if user data exists
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('username').innerText = tg.initDataUnsafe.user.first_name || "EarnWave";
        }

        // Silent Ad Trigger Integration Hook
        document.getElementById('watchVideoBtn').addEventListener('click', () => {
            // Placeholder: Call your invisible Adsgram controller here
            // Example: adController.show().then(() => { /* update balance */ });
            alert("Triggering bonus video stream...");
        });
    </script>
</body>
</html>
