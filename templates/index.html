<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EarnWave Mini App</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b132b;
            --card-bg: #1c2541;
            --accent-blue: #3a86ff;
            --text-white: #ffffff;
            --text-gray: #8d99ae;
            --success-green: #2ecc71;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            padding: 16px;
            padding-bottom: 90px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .app-title h1 {
            font-size: 20px;
            font-weight: 700;
        }
        .app-title p {
            font-size: 12px;
            color: var(--text-gray);
        }
        .balance-card {
            background: linear-gradient(135deg, #3a86ff, #2563eb);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 12px rgba(58, 134, 255, 0.3);
        }
        .balance-card .label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
        }
        .balance-card .amount {
            font-size: 32px;
            font-weight: 700;
            margin: 8px 0 12px 0;
        }
        .balance-stats {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            opacity: 0.9;
            border-top: 1px solid rgba(255,255,255,0.15);
            padding-top: 10px;
        }
        .action-btn {
            background-color: var(--card-bg);
            border: none;
            border-radius: 12px;
            width: 100%;
            padding: 16px;
            color: var(--text-white);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .action-btn i {
            color: var(--accent-blue);
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .card h3 {
            font-size: 14px;
            margin-bottom: 8px;
            color: var(--text-gray);
        }
        .input-group {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .input-group input {
            flex: 1;
            background: #0b132b;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 10px;
            color: white;
            font-size: 14px;
        }
        .input-group button {
            background: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #080f24;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .nav-item {
            color: var(--text-gray);
            font-size: 12px;
            text-align: center;
            text-decoration: none;
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
        }
        .nav-item.active {
            color: var(--accent-blue);
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="app-title">
            <h1 id="username"><i class="fa-solid fa-bolt"></i> EarnWave</h1>
            <p>Watch • Earn • Withdraw</p>
        </div>
    </div>

    <div class="balance-card">
        <div class="label"><i class="fa-solid fa-wallet"></i> Available balance</div>
        <div class="amount" id="balance">$0.000</div>
        <div class="balance-stats">
            <span id="todayEarnings"><i class="fa-solid fa-chart-line"></i> Total earned: $0.000</span>
            <span id="adsCount"><i class="fa-solid fa-tv"></i> Ads watched: 0/50</span>
        </div>
    </div>

    <button class="action-btn" id="watchVideoBtn">
        <div>
            <div style="text-align: left;"><i class="fa-solid fa-play-circle" style="color: var(--accent-blue);"></i> Watch Bonus Video</div>
            <div style="font-size: 12px; color: var(--text-gray); font-weight: normal; margin-top: 4px;">Earn $0.005 per view</div>
        </div>
        <i class="fa-solid fa-chevron-right"></i>
    </button>

    <button class="action-btn" id="checkinBtn">
        <div>
            <div style="text-align: left;"><i class="fa-solid fa-calendar-check" style="color: var(--success-green);"></i> Daily Check-in</div>
            <div style="font-size: 12px; color: var(--text-gray); font-weight: normal; margin-top: 4px;" id="streakText">Streak: 0 days</div>
        </div>
        <span style="color: var(--success-green); font-weight: 600;">Claim</span>
    </button>

    <div class="card">
        <h3><i class="fa-solid fa-money-bill-transfer"></i> Request Withdrawal (Min: $0.250)</h3>
        <div class="input-group">
            <input type="text" id="walletInput" placeholder="Enter Wallet / USDT address">
            <button id="withdrawBtn">Withdraw</button>
        </div>
    </div>

    <div class="card">
        <h3><i class="fa-solid fa-shield-halved"></i> Recent Network Payouts</h3>
        <div id="liveTicker" style="font-size: 13px; color: var(--text-gray); min-height: 40px; display: flex; flex-init: column; justify-content: center;">
            Loading live network transactions...
        </div>
    </div>

    <div class="nav-bar">
        <button class="nav-item active"><i class="fa-solid fa-house"></i> Home</button>
        <button class="nav-item" onclick="alert('Referral system active via Telegram bot links!')"><i class="fa-solid fa-users"></i> Referrals</button>
    </div>

    <!-- Monetag SDK script insertion placeholder (Replace YOUR_ZONE_ID with your actual tag script/zone) -->
    <script src="https://alwingulla.com/88/tag.min.js" data-zone="YOUR_ZONE_ID" async data-sdk="show_YOUR_ZONE_ID"></script>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const userId = (tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) 
            ? String(tg.initDataUnsafe.user.id) 
            : "7548212601";

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('username').innerHTML = `<i class="fa-solid fa-bolt"></i> ${tg.initDataUnsafe.user.first_name || "EarnWave"}`;
        }

        function loadUserData() {
            fetch(`/api/user/${userId}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('balance').innerText = '$' + data.balance.toFixed(3);
                    document.getElementById('todayEarnings').innerHTML = `<i class="fa-solid fa-chart-line"></i> Total earned: $${data.total_earned.toFixed(3)}`;
                    document.getElementById('adsCount').innerHTML = `<i class="fa-solid fa-tv"></i> Ads watched: ${data.ads_today}/${data.daily_limit}`;
                    document.getElementById('streakText').innerText = `Streak: ${data.checkin_streak} days`;
                })
                .catch(err => console.error("Error loading user data:", err));
        }

        loadUserData();
        setInterval(loadUserData, 5000); // Auto-syncs balance when S2S postback hits backend

        // Monetag Ad Handler triggering the global function provided by your tag script
        document.getElementById('watchVideoBtn').addEventListener('click', () => {
            if (typeof show_YOUR_ZONE_ID === 'function') {
                show_YOUR_ZONE_ID().catch(err => console.log("Ad display error:", err));
            } else {
                alert("Ad network is loading or Zone ID is misconfigured. Make sure your Monetag Zone script is fully loaded.");
            }
        });

        document.getElementById('checkinBtn').addEventListener('click', () => {
            fetch('/api/checkin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "ok") {
                    loadUserData();
                    alert(`Check-in successful! Earned $${data.reward.toFixed(3)} (Streak: ${data.streak})`);
                } else {
                    alert(data.error || "Already checked in today.");
                }
            });
        });

        document.getElementById('withdrawBtn').addEventListener('click', () => {
            const wallet = document.getElementById('walletInput').value;
            const balanceText = document.getElementById('balance').innerText.replace('$', '');
            const amount = parseFloat(balanceText);

            fetch('/api/withdraw', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, wallet: wallet, amount: amount })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "ok") {
                    loadUserData();
                    document.getElementById('walletInput').value = '';
                    alert("Withdrawal request submitted successfully!");
                } else {
                    alert(data.error || "Withdrawal failed. Check minimum balance.");
                }
            });
        });

        const nigerianNames = [
            "Adebayo", "Adewale", "Babatunde", "Dayo", "Femi", "Kayode", "Olumide", "Olawale", "Tunde", "Segun", 
            "Opeyemi", "Ayodele", "Bolaji", "Folorunsho", "Damilola", "Adetutu", "Bolanle", "Bukola", "Folashade", "Modupe", 
            "Morayo", "Oluwatosin", "Omolara", "Simisola", "Titilayo", "Yetunde", "Yewande", "Temitope", "Funmilayo", "Ibironke", 
            "Chinedu", "Chukwudi", "Emeka", "Kelechi", "Obinna", "Uche", "Arinze", "Chibuzo", "Ikenna", "Nnamdi", 
            "Okey", "Tochi", "Chinonso", "Ifeanyi", "Chidi", "Adaora", "Chiamaka", "Chidinma", "Chioma", "Ebele", 
            "Ngozi", "Nkechi", "Nneka", "Ogechi", "Uchechi", "Amarachi", "Onyinye", "Chinwe", "Akudo", "Kamsi", 
            "Abubakar", "Aliyu", "Aminu", "Bello", "Faruk", "Garba", "Haruna", "Ibrahim", "Kabir", "Mohammed", 
            "Sani", "Umar", "Usman", "Yakubu", "Zayyan", "Aisha", "Asmau", "Bilikisu", "Fatima", "Hafsat", 
            "Halima", "Khadija", "Maryam", "Nafisa", "Rukayya", "Safiya", "Zainab", "Zulaihat", "Jamila", "Hauwa", 
            "Oghene", "Ejiro", "Okiemute", "Pere", "Toritseju", "Ogaga", "Eseoghene", "Efemena", "Oritsemeyiwa", "Ufuoma", 
            "Terfa", "Ngodoo", "Mlumun", "Owoicho", "Aondover", "Dooshima", "Tertsea", "Suwaid", "Ojone", "Eje"
        ];

        function generateTxHash() {
            const chars = "abcdef0123456789";
            let hash = "0x";
            for (let i = 0; i < 8; i++) {
                hash += chars[Math.floor(Math.random() * chars.length)];
            }
            hash += "...";
            for (let i = 0; i < 4; i++) {
                hash += chars[Math.floor(Math.random() * chars.length)];
            }
            return hash;
        }

        function updateTicker() {
            const randomName = nigerianNames[Math.floor(Math.random() * nigerianNames.length)];
            const randomAmount = (Math.random() * (4.50 - 0.25) + 0.25).toFixed(2);
            const randomHash = generateTxHash();
            
            document.getElementById('liveTicker').innerHTML = `
                <div style="color: var(--success-green); font-weight: 600;"><i class="fa-solid fa-circle-check"></i> ${randomName} withdrew $${randomAmount}</div>
                <div style="font-size: 11px; opacity: 0.7; margin-top: 2px;">Tx: ${randomHash} • Just now</div>
            `;
        }

        updateTicker();
        setInterval(updateTicker, 4000);
    </script>
</body>
</html>
